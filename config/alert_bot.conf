# Settings of the personal Telegram alert bot (scripts/alert_bot.py). No secrets here: the bot token, the chat id and the Ukraine Alarm token are in the macOS keychain.
#
# [watch]: one line per oblast, "name = threshold in percent". You get a message when the probability of a NEW alert within 1 hour goes from below the threshold to
# at or above it. Nothing while it stays above (or below). At most one message per oblast per cooldown_hours.
# Names, Ukrainian or English: Київ / м. Київ / Kyiv City, Київська / Київська область / Kyivska, Харківська, Kharkivska, ... (python scripts/alert_bot.py --check shows how they are read)
# Add or remove lines freely. The first run only records where each oblast stands and sends nothing.

[settings]
cooldown_hours = 3

[watch]
м. Київ = 50
Київська область = 50
